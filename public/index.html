<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batuhan Calorie Tracker</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z" fill="currentColor"/>
      </svg>
      <span class="brand-name">Batuhan Calorie Tracker</span>
    </div>
    <button id="whoopBtn" class="whoop-pill" data-connected="false">
      <span class="dot" aria-hidden="true"></span>
      <span id="whoopBtnLabel">Connect Whoop</span>
    </button>
  </header>

  <!-- Signature element: the energy gauge -->
  <section class="gauge-card" aria-label="Today's energy balance">
    <div class="gauge-readout">
      <div class="readout-block">
        <span class="readout-label">in</span>
        <span class="readout-value mono" id="consumedValue">0</span>
      </div>
      <div class="readout-block net-block">
        <span class="readout-label" id="netLabel">net</span>
        <span class="readout-value mono" id="netValue">—</span>
      </div>
      <div class="readout-block">
        <span class="readout-label">out</span>
        <span class="readout-value mono" id="burnedValue">—</span>
      </div>
    </div>

    <div class="gauge-track" role="img" aria-label="Calories consumed versus calories burned">
      <div class="gauge-fill" id="gaugeFill"></div>
      <div class="gauge-burn-marker" id="gaugeBurnMarker"></div>
    </div>
    <p class="gauge-caption" id="gaugeCaption">Connect Whoop to see today's burn.</p>
  </section>

  <!-- Capture panel -->
  <section class="capture-card">
    <h2 class="section-title">Log a meal</h2>

    <div class="capture-stage" id="captureStage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <img id="preview" hidden alt="Captured food photo">
      <div class="stage-empty" id="stageEmpty">
        <svg class="stage-empty-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" fill="currentColor"/>
        </svg>
        <p>Point your camera at a meal, or upload a photo.</p>
      </div>
    </div>

    <div class="capture-controls" id="captureControls">
      <button id="startCameraBtn" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 19V5c0-1.1-.9-2-2-2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM12 5c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5-5z" fill="currentColor"/>
        </svg>
        Use camera
      </button>
      <label class="btn btn-secondary file-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
        </svg>
        Upload photo
        <input type="file" id="fileInput" accept="image/*" hidden>
      </label>
      <button id="shootBtn" class="btn btn-primary" hidden>
        <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 19V5c0-1.1-.9-2-2-2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM12 5c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5-5z" fill="currentColor"/>
        </svg>
        Capture
      </button>
      <button id="retakeBtn" class="btn btn-secondary" hidden>
        <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 10l5 5 5-5z" fill="currentColor" transform="rotate(180 12 12)"/>
        </svg>
        Retake
      </button>
      <button id="analyzeBtn" class="btn btn-primary" hidden>
        <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 9h-2v2h2V9zm0 4h-2v2h2v-2zm4-4h-2v2h2V9zm0 4h-2v2h2v-2zM3 3h18v2H3V3zm0 16h18v2H3v-2zM9 9H7v2h2V9zm0 4H7v2h2v-2z" fill="currentColor"/>
        </svg>
        Estimate calories
      </button>
    </div>

    <div class="analysis-result" id="analysisResult" hidden>
      <div class="result-header">
        <span class="result-confidence" id="resultConfidence"></span>
      </div>
      <ul class="result-items" id="resultItems"></ul>
      <p class="result-note" id="resultNote"></p>
      <div class="result-total-row">
        <label for="totalInput">Total calories</label>
        <input type="number" id="totalInput" class="total-input mono" min="0" step="1">
      </div>
      <div class="result-actions">
        <button id="discardBtn" class="btn btn-ghost">Discard</button>
        <button id="addToLogBtn" class="btn btn-primary">Add to today's log</button>
      </div>
    </div>

    <p class="analysis-status" id="analysisStatus" hidden></p>
  </section>

  <!-- Today's log -->
  <section class="log-card">
    <div class="log-header">
      <h2 class="section-title">Today</h2>
      <span class="log-total mono" id="logTotal">0 kcal</span>
    </div>
    <ul class="log-list" id="logList">
      <li class="log-empty" id="logEmpty">Nothing logged yet today.</li>
    </ul>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
